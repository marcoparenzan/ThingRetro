<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fake64 editor</title>
    <style>
        html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
        #message { display: none; color: #ccc; font: 14px "Segoe UI", sans-serif; padding: 24px; }
    </style>
</head>
<body>
    <div id="editor"></div>
    <div id="message"></div>
    <!-- Monaco (the editor of Visual Studio Code) from the CDN: the first start needs an internet connection,
         then WebView2 keeps it in its cache -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="editor.js"></script>
</body>
</html>
